# Builds the sites with Eleventy, checks them, and publishes _site/ to GitHub Pages
# on every push to main. In the repo: Settings -> Pages -> Source: "GitHub Actions".
# If any check fails, nothing is published and the live site stays as it was.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check HTML is valid
        run: npm run check:html
      - name: Check for broken links and images
        run: npm run check:links
      - name: Check accessibility (axe, WCAG 2.1 AA)
        run: npm run check:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
