<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <!-- Stylesheet -->
  <style>
    .bg { fill: #FAFAFA; }
    .stroke-light { stroke: #CCCCCC; stroke-width: 1; }
    .stroke-dashed { stroke: #CCCCCC; stroke-width: 1.5; stroke-dasharray: 4; }
    .fill-grey { fill: #E5E7EB; }
    .text-title { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; fill: #1F2937; }
    .text-sub { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; fill: #6B7280; letter-spacing: 2px; }
    .text-body { font-family: 'Inter', sans-serif; font-size: 14px; fill: #9CA3AF; }
    .btn-fill { fill: #374151; }
    .btn-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; }
  </style>

  <!-- Background Canvas -->
  <rect class="bg" width="1440" height="900"/>

  <!-- Navigation Bar (Height: 80px) -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" class="stroke-light"/>
  <!-- Logo Placeholder -->
  <rect x="120" y="20" width="40" height="40" rx="6" class="fill-grey stroke-light"/>
  <text x="172" y="45" font-family="Inter" font-size="18" font-weight="700" fill="#374151">Logo Placeholder</text>
  <!-- Nav Items -->
  <text x="750" y="46" font-family="Inter" font-size="14" font-weight="500" fill="#9CA3AF">Home</text>
  <text x="820" y="46" font-family="Inter" font-size="14" font-weight="500" fill="#9CA3AF">About Us</text>
  <text x="910" y="46" font-family="Inter" font-size="14" font-weight="500" fill="#9CA3AF">Products</text>
  <text x="1000" y="46" font-family="Inter" font-size="14" font-weight="500" fill="#9CA3AF">Gallery</text>
  <text x="1080" y="46" font-family="Inter" font-size="14" font-weight="600" fill="#1F2937">Contact</text>
  <!-- CTA Button -->
  <rect x="1170" y="20" width="150" height="40" rx="4" class="btn-fill"/>
  <text x="1215" y="44" class="btn-text">Action Button</text>

  <!-- Hero Section -->
  <rect x="0" y="80" width="1440" height="200" fill="#F3F4F6" class="stroke-light"/>
  <text x="120" y="150" class="text-sub">GET IN TOUCH</text>
  <text x="120" y="195" font-family="Inter" font-size="36" font-weight="800" fill="#1F2937">Contact Us Page Wireframe</text>

  <!-- Split Contact Layout -->
  <!-- Left Side: Interactive Form Blueprint -->
  <rect x="120" y="320" width="560" height="400" rx="8" fill="#FFFFFF" class="stroke-light"/>
  <text x="160" y="370" font-family="Inter" font-size="20" font-weight="700" fill="#1F2937">Inquiry Form Placeholder</text>

  <!-- Input Field 1 -->
  <text x="160" y="415" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">FULL NAME LABEL</text>
  <rect x="160" y="430" width="480" height="40" rx="4" class="stroke-light" fill="#FCFCFC"/>
  <text x="175" y="455" font-family="Inter" font-size="12" fill="#9CA3AF">Placeholder text input field...</text>

  <!-- Input Field 2 -->
  <text x="160" y="495" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">EMAIL ADDRESS LABEL</text>
  <rect x="160" y="510" width="480" height="40" rx="4" class="stroke-light" fill="#FCFCFC"/>
  <text x="175" y="535" font-family="Inter" font-size="12" fill="#9CA3AF">Placeholder email input field...</text>

  <!-- Textarea Input Field -->
  <text x="160" y="575" font-family="Inter" font-size="12" font-weight="600" fill="#6B7280">MESSAGE DETAIL LABEL</text>
  <rect x="160" y="590" width="480" height="80" rx="4" class="stroke-light" fill="#FCFCFC"/>
  <text x="175" y="615" font-family="Inter" font-size="12" fill="#9CA3AF">Placeholder message textarea block...</text>

  <!-- Form Submit Button -->
  <rect x="160" y="685" width="480" height="45" rx="4" fill="#374151"/>
  <text x="350" y="712" class="btn-text">Submit Action</text>

  <!-- Right Side: Contact Details and Map Grid -->
  <text x="760" y="350" class="text-sub">OUR ADDRESS</text>
  <text x="760" y="390" class="text-title">Studio Headquarters</text>
  <text x="760" y="420" font-family="Inter" font-size="14" fill="#6B7280">City Location Address details placeholder line 1</text>
  <text x="760" y="440" font-family="Inter" font-size="14" fill="#6B7280">State, ZIP, Country details line 2</text>

  <!-- Map Area Box (Crossed Box) -->
  <rect x="760" y="480" width="560" height="240" rx="8" fill="#FFFFFF" class="stroke-light"/>
  <line x1="760" y1="480" x2="1320" y2="720" class="stroke-light"/>
  <line x1="1320" y1="480" x2="760" y2="720" class="stroke-light"/>
  <rect x="965" y="580" width="150" height="40" rx="20" fill="#E5E7EB" class="stroke-light"/>
  <text x="985" y="605" font-family="Inter" font-size="12" font-weight="600" fill="#9CA3AF">Map Placeholder</text>

  <!-- Footer Section -->
  <rect x="0" y="760" width="1440" height="140" fill="#1F2937"/>
  <!-- Left Side Footer -->
  <text x="120" y="820" font-family="Inter" font-size="16" font-weight="700" fill="#FFFFFF">Brand Identity</text>
  <text x="120" y="850" font-family="Inter" font-size="12" fill="#9CA3AF">© 2026 Brand MSME. All rights reserved.</text>
  <!-- Right Side Footer Links -->
  <text x="1000" y="820" font-family="Inter" font-size="12" font-weight="600" fill="#9CA3AF">FOOTER LINK</text>
  <text x="1120" y="820" font-family="Inter" font-size="12" font-weight="600" fill="#9CA3AF">FOOTER LINK</text>
  <text x="1240" y="820" font-family="Inter" font-size="12" font-weight="600" fill="#9CA3AF">FOOTER LINK</text>
</svg>
